<!-- src/app/pages/login/login.page.html -->
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Welcome Back</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>
          <ion-icon name="log-in-outline" size="large"></ion-icon>
          Login to Your Account
        </ion-card-title>
        <ion-card-subtitle>Enter your credentials to continue</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <ion-item>
            <ion-label position="floating">Email</ion-label>
            <ion-input
              type="email"
              formControlName="email"
              placeholder="you@example.com"
              [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            </ion-input>
            <ion-note slot="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              Valid email is required
            </ion-note>
          </ion-item>

          <ion-item>
            <ion-label position="floating">Password</ion-label>
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter your password">
            </ion-input>
            <ion-button slot="end" fill="clear" (click)="togglePassword()">
              <ion-icon [name]="showPassword ? 'eye-off' : 'eye'"></ion-icon>
            </ion-button>
          </ion-item>

          <ion-button
            expand="block"
            type="submit"
            [disabled]="loginForm.invalid || isSubmitting"
            class="ion-margin-top">
            <ion-icon name="log-in-outline" slot="start"></ion-icon>
            {{ isSubmitting ? 'Logging in...' : 'Login' }}
          </ion-button>

          <div class="ion-text-center ion-margin-top">
            <ion-text color="medium">
              Don't have an account?
              <a routerLink="/register" class="link">Register here</a>
            </ion-text>
          </div>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
