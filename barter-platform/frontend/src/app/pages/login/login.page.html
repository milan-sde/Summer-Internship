<ion-content class="ion-padding" [fullscreen]="true">
  <div class="auth-wrapper">
    <div class="form-container">
      <!-- Title Area -->
      <div class="form-header">
        <div class="logo-container">
          <div class="logo-dot"></div>
          <span class="logo-text">Barter</span>
        </div>
        <h2>Welcome back</h2>
        <p>Enter your details to sign in to your account</p>
      </div>

      <!-- Glassmorphic Card Container -->
      <div class="glassmorphism-card">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Email Input -->
          <div class="custom-input-group">
            <label class="custom-input-label">Email address</label>
            <ion-item lines="none" class="custom-input-item">
              <ion-icon
                name="mail-outline"
                slot="start"
                class="input-icon"
              ></ion-icon>
              <ion-input
                type="email"
                formControlName="email"
                placeholder="name@company.com"
                [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
              >
              </ion-input>
            </ion-item>
          </div>
          @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched)
          {
          <div class="error-container">
            <ion-text color="danger">
              <small>Please enter a valid email address</small>
            </ion-text>
          </div>
          }

          <!-- Password Input -->
          <div class="custom-input-group">
            <label class="custom-input-label">Password</label>
            <ion-item lines="none" class="custom-input-item">
              <ion-icon
                name="lock-closed-outline"
                slot="start"
                class="input-icon"
              ></ion-icon>
              <ion-input
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="Enter password"
              >
              </ion-input>
              <ion-button
                slot="end"
                fill="clear"
                (click)="togglePassword()"
                class="password-toggle-btn"
              >
                <ion-icon
                  [name]="showPassword ? 'eye-off' : 'eye'"
                  slot="icon-only"
                ></ion-icon>
              </ion-button>
            </ion-item>
          </div>

          <ion-button
            expand="block"
            type="submit"
            [disabled]="loginForm.invalid || isSubmitting"
            class="submit-btn"
          >
            {{ isSubmitting ? 'Signing in...' : 'Sign in' }}
          </ion-button>

          <div class="footer-container">
            <ion-text color="medium" class="footer-text">
              Don't have an account?
              <a routerLink="/register" class="link">Create an account</a>
            </ion-text>
          </div>
        </form>
      </div>
    </div>
  </div>
</ion-content>
