<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Verify Email</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/register"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="verify-container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>
          <ion-icon name="mail-unread-outline" size="large"></ion-icon>
          Check Your Email
        </ion-card-title>
        <ion-card-subtitle>
          We've sent a verification code to
        </ion-card-subtitle>
        <ion-text color="primary">
          <h3>{{ email }}</h3>
        </ion-text>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="verifyOtpForm" (ngSubmit)="onSubmit()">
          <ion-item>
            <ion-label position="floating">Enter 6-Digit Code</ion-label>
            <ion-input
              type="text"
              formControlName="otp"
              placeholder="123456"
              maxlength="6"
              inputmode="numeric">
            </ion-input>
            <ion-note slot="error" *ngIf="verifyOtpForm.get('otp')?.invalid && verifyOtpForm.get('otp')?.touched">
              Please enter a valid 6-digit code
            </ion-note>
          </ion-item>

          <div class="timer-section" *ngIf="!canResend">
            <ion-text color="medium">
              Resend code in {{ timer }} seconds
            </ion-text>
          </div>

          <ion-button
            expand="block"
            type="submit"
            [disabled]="verifyOtpForm.invalid || isSubmitting"
            class="ion-margin-top">
            <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
            {{ isSubmitting ? 'Verifying...' : 'Verify Code' }}
          </ion-button>

          <div class="ion-text-center ion-margin-top">
            <ion-text color="medium">
              Didn't receive the code?
              <a (click)="resendOtp()" [class.disabled]="!canResend" class="resend-link">
                Resend
              </a>
            </ion-text>
          </div>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
