<ion-content class="ion-padding" [fullscreen]="true">
  <div class="auth-wrapper">
    <div class="form-container">
      <div class="form-header">
        <div class="logo-container">
          <div class="logo-dot"></div>
          <span class="logo-text">Creator Link</span>
        </div>
        <h2>Forgot password?</h2>
        <p>Enter your email and we'll send you a reset code</p>
      </div>

      <div class="glassmorphism-card">
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
          <div class="custom-input-group">
            <label class="custom-input-label">Email address</label>
            <ion-item lines="none" class="custom-input-item">
              <ion-icon
                name="mail-outline"
                slot="start"
                class="input-icon"
              ></ion-icon>
              <ion-input
                type="email"
                formControlName="email"
                placeholder="name@company.com"
                [class.invalid]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
              >
              </ion-input>
            </ion-item>
          </div>
          @if (forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched)
          {
          <div class="error-container">
            <ion-text color="danger">
              <small>Please enter a valid email address</small>
            </ion-text>
          </div>
          }

          <ion-button
            expand="block"
            type="submit"
            [disabled]="forgotForm.invalid || isSubmitting"
            class="submit-btn"
          >
            {{ isSubmitting ? 'Sending...' : 'Send reset code' }}
          </ion-button>

          <div class="footer-container">
            <ion-text color="medium" class="footer-text">
              <a routerLink="/login" class="link">
                <ion-icon name="arrow-back" class="back-icon"></ion-icon>
                Back to login
              </a>
            </ion-text>
          </div>
        </form>
      </div>
    </div>
  </div>
</ion-content>
