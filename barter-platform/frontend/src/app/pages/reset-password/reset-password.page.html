<ion-content class="ion-padding" [fullscreen]="true">
  <div class="auth-wrapper">
    <div class="form-container">
      <div class="form-header">
        <div class="logo-container">
          <div class="logo-dot"></div>
          <span class="logo-text">Creator Link</span>
        </div>
        <h2>Reset password</h2>
        <p>Enter the code from your email and set a new password</p>
      </div>

      <div class="glassmorphism-card">
        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
          <div class="custom-input-group">
            <label class="custom-input-label">Email address</label>
            <ion-item lines="none" class="custom-input-item">
              <ion-icon
                name="mail-outline"
                slot="start"
                class="input-icon"
              ></ion-icon>
              <ion-input
                type="email"
                formControlName="email"
                placeholder="name@company.com"
                [class.invalid]="resetForm.get('email')?.invalid && resetForm.get('email')?.touched"
              >
              </ion-input>
            </ion-item>
          </div>

          <div class="custom-input-group">
            <label class="custom-input-label">Reset code</label>
            <ion-item lines="none" class="custom-input-item">
              <ion-icon
                name="key-outline"
                slot="start"
                class="input-icon"
              ></ion-icon>
              <ion-input
                type="text"
                formControlName="otp"
                placeholder="000000"
                maxlength="6"
                inputmode="numeric"
                [class.invalid]="resetForm.get('otp')?.invalid && resetForm.get('otp')?.touched"
              >
              </ion-input>
            </ion-item>
          </div>
          @if (resetForm.get('otp')?.invalid && resetForm.get('otp')?.touched)
          {
          <div class="error-container">
            <ion-text color="danger">
              <small>Please enter a valid 6-digit code</small>
            </ion-text>
          </div>
          }

          <div class="custom-input-group">
            <label class="custom-input-label">New password</label>
            <ion-item lines="none" class="custom-input-item">
              <ion-icon
                name="lock-closed-outline"
                slot="start"
                class="input-icon"
              ></ion-icon>
              <ion-input
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="Enter new password"
              >
              </ion-input>
              <ion-button
                slot="end"
                fill="clear"
                (click)="togglePassword()"
                class="password-toggle-btn"
              >
                <ion-icon
                  [name]="showPassword ? 'eye-off' : 'eye'"
                  slot="icon-only"
                ></ion-icon>
              </ion-button>
            </ion-item>
          </div>

          <div class="custom-input-group">
            <label class="custom-input-label">Confirm new password</label>
            <ion-item lines="none" class="custom-input-item">
              <ion-icon
                name="lock-closed-outline"
                slot="start"
                class="input-icon"
              ></ion-icon>
              <ion-input
                [type]="showConfirmPassword ? 'text' : 'password'"
                formControlName="confirmPassword"
                placeholder="Confirm new password"
              >
              </ion-input>
              <ion-button
                slot="end"
                fill="clear"
                (click)="toggleConfirmPassword()"
                class="password-toggle-btn"
              >
                <ion-icon
                  [name]="showConfirmPassword ? 'eye-off' : 'eye'"
                  slot="icon-only"
                ></ion-icon>
              </ion-button>
            </ion-item>
          </div>

          <ion-button
            expand="block"
            type="submit"
            [disabled]="resetForm.invalid || isSubmitting"
            class="submit-btn"
          >
            {{ isSubmitting ? 'Resetting...' : 'Reset password' }}
          </ion-button>

          <div class="footer-container">
            <ion-text color="medium" class="footer-text">
              <a routerLink="/login" class="link">Back to login</a>
            </ion-text>
          </div>
        </form>
      </div>
    </div>
  </div>
</ion-content>
