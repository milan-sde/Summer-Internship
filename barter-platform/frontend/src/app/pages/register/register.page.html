<!-- src/app/pages/register/register.page.html -->
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Create Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>
        <ion-icon name="person-add-outline" size="large"></ion-icon>
        Join Barter Platform
      </ion-card-title>
      <ion-card-subtitle>Choose your account type</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <ion-item>
          <ion-label position="floating">Email</ion-label>
          <ion-input
            type="email"
            formControlName="email"
            placeholder="you@example.com">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-label>Account Type</ion-label>
          <ion-radio-group formControlName="role">
            <ion-list-header>
              <ion-label>Select your role</ion-label>
            </ion-list-header>

            <ion-item>
              <ion-label>Influencer</ion-label>
              <ion-radio slot="start" value="INFLUENCER"></ion-radio>
              <ion-text color="medium" class="ion-padding-start">
                <small>Create content and collaborate with brands</small>
              </ion-text>
            </ion-item>

            <ion-item>
              <ion-label>Brand</ion-label>
              <ion-radio slot="start" value="BRAND"></ion-radio>
              <ion-text color="medium" class="ion-padding-start">
                <small>Find influencers for your campaigns</small>
              </ion-text>
            </ion-item>
          </ion-radio-group>
        </ion-item>

        <ion-button
          expand="block"
          type="submit"
          [disabled]="registerForm.invalid || isSubmitting"
          class="ion-margin-top">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          {{ isSubmitting ? 'Sending...' : 'Register with Email' }}
        </ion-button>

        <div class="ion-text-center ion-margin-top">
          <ion-text color="medium">
            Already have an account?
            <a routerLink="/login" class="link">Login here</a>
          </ion-text>
        </div>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
