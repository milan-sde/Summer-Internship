<header class="app-header-container">
  <div class="header-left">
    <!-- Mobile Hamburger Toggle -->
    <button *ngIf="!showBackButton" class="mobile-toggle-btn" (click)="onMenuClick()">
      <ion-icon name="menu-outline"></ion-icon>
    </button>

    <!-- Back Button -->
    <button *ngIf="showBackButton" class="back-btn" (click)="goBack()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <h1 class="page-title">{{ title }}</h1>
  </div>

  <div class="header-right">
    <!-- Theme Toggle Button -->
    <button class="icon-btn" (click)="themeService.toggleTheme()" title="Toggle Theme (Light/Dark/System)">
      <ion-icon [name]="getCurrentThemeIcon()"></ion-icon>
    </button>

    <!-- Notification Button -->
    <button class="icon-btn notification-btn" (click)="toggleNotificationPanel()">
      <ion-icon name="notifications-outline"></ion-icon>
      @if (unreadCount > 0) {
        <span class="notification-badge">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
      }
    </button>

    <!-- User Avatar Menu Button -->
    <button class="avatar-menu-btn" (click)="viewProfile()">
      <div class="avatar-circle">
        @if (user.avatarUrl) {
          <img
            [src]="user.avatarUrl"
            class="avatar-img"
            (error)="onAvatarError()"
            alt="Profile"
          />
        }
        @if (!user.avatarUrl) {
          <span class="avatar-initial">{{ user.fullName ? user.fullName.charAt(0).toUpperCase() : (user.email ? user.email.charAt(0).toUpperCase() : 'U') }}</span>
        }
      </div>
    </button>
  </div>

  @if (isNotificationPanelOpen) {
    <app-notification-panel
      [isOpen]="isNotificationPanelOpen"
      (closePanel)="closeNotificationPanel()"
      (unreadCountChanged)="onUnreadCountChanged($event)"
    ></app-notification-panel>
  }
</header>
